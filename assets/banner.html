<!doctype html>
<!-- Source for assets/banner.png (2400 by 840). The page is 1200 by 420, and the renderer shoots it at 2x.
     Render with: node scripts/render-banner.mjs
     The mark is the Santori Labs logo from the site, at the 32px size the home page uses.
     The background is chalk and the words are ink, from public/brand.css and public/index.html on journeysfirst.com.
     The type is Cascadia Mono, the mono the site names first for its share image, under the SIL Open Font License (assets/fonts/OFL.txt).
     The home page itself sets ui-monospace, SF Mono, Menlo, Consolas, at weight 400. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journeys First</title>
<style>
@font-face {
  font-family: "Cascadia Mono";
  src: url("fonts/cascadia-mono-regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  width: 1200px;
  height: 420px;
  overflow: hidden;
  background: #f7f9f4;
  color: #141516;
  font-family: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-weight: 400;
}
.mark {
  position: absolute;
  top: 40px;
  left: 80px;
  width: 32px;
  height: 32px;
}
.sheet {
  position: absolute;
  left: 80px;
  right: 80px;
  top: 50%;
  transform: translateY(-50%);
}
h1 {
  margin: 0;
  font: 400 36px/1.15 "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: normal;
}
p {
  margin: 16px 0 0;
  font: 400 17px/28px "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: normal;
  color: #141516;
  white-space: nowrap;
}
p + p { margin-top: 0; }
</style>
</head>
<body>
<img class="mark" src="mark.svg" alt="Santori Labs">
<div class="sheet">
  <h1>Journeys First</h1>
  <p>An open format for user journeys, with skills and a CLI.</p>
  <p>Your agent verifies each journey in the real product before it says done, as every user, human or agent.</p>
</div>
</body>
</html>
