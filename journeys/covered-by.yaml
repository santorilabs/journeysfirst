# Paths each journey covers, from the repo root.
# A journey is run again when a change matches one of its paths.
# A trailing /** covers that folder. A journey with no entry is not selected.
# This file is for the tool. The journey sentences do not list paths.

start-from-an-empty-project:
  - README.md
  - packages/core/README.md
  - docs/overview.md
  - packages/core/src/setup.js
  - packages/core/src/doctor.js
  - packages/core/templates/**
  - packages/core/bin/journeysfirst.js

let-an-agent-write-a-journey:
  - skills/**
  - packages/core/src/setup.js

hand-a-project-to-a-new-agent:
  - skills/**
  - docs/**
  - spec/**
  - packages/core/src/setup.js

run-the-journeys-a-change-covers:
  - packages/core/src/format/affected.js
  - packages/core/bin/journeysfirst.js
  - journeys/covered-by.yaml

see-why-a-run-failed:
  - packages/core/src/runner/**
  - packages/core/src/review/review.js
  - skills/journey-fix/**

let-an-agent-run-a-journey:
  - packages/core/bin/journeysfirst.js
  - packages/core/src/runner/**
  - packages/core/src/format/run-folder.js
  - packages/core/src/format/runfile.js

keep-an-aborted-agent-rerun:
  - packages/core/bin/journeysfirst.js
  - packages/core/src/runner/**
  - packages/core/src/format/merge-check.js
  - packages/core/src/format/run-folder.js
  - packages/core/src/format/runfile.js

run-a-custom-agent-command:
  - packages/core/bin/journeysfirst.js
  - packages/core/src/runner/agent.js
  - packages/core/src/runner/capture.js
  - packages/core/src/runner/capture.mjs
  - packages/core/src/format/run-folder.js
  - packages/core/src/format/runfile.js
  - packages/core/src/review/**
