# yaml-language-server: $schema=https://raw.githubusercontent.com/santorilabs/journeysfirst/main/spec/journey-v1.schema.json
format: journeysfirst/v1
title: See what it is before you install
promise: I just found Journeys First. I wanna see what it is about and if I wanna install it
users: [teammate]
start: You have not installed it. You and the teammate are both looking at the page a newcomer sees.
steps:
  - Read the page a newcomer sees.
  - check: You see what Journeys First is.
    id: what-it-is
  - check: You see who it is for.
    id: who-it-is-for
  - check: You see how to get started.
    id: how-to-start
  - check: The teammate sees the same way to get started.
    id: teammate-sees-how-to-start
    added: true
  - check: The teammate sees "Journeys First", the same product you see.
    id: teammate-sees-the-same-product
    added: true
  - Install it and set the project up.
  - Run the first journey.
  - check: You see the first run pass.
    id: first-run-passes
  - check: The teammate sees that the first run passed.
    id: teammate-sees-the-pass
    added: true
  - check: The teammate does not see an error from that run.
    id: teammate-sees-no-error
    added: true
  - Leave the app address out of the setup.
  - Ask what is wrong.
  - check: You see that the app address is missing, and you see what to put there.
    id: missing-address
    added: true
  - check: The teammate does not see the broken setup listed as a pass.
    id: teammate-no-false-pass
    added: true
notes: The page a newcomer sees is the README, the package page, and the overview shipped with the repo. The first run is the sample the setup adds when the project has no app of its own. The app address is the address a run opens.
