# yaml-language-server: $schema=https://raw.githubusercontent.com/santorilabs/journeysfirst/main/spec/journey-v1.schema.json
format: journeysfirst/v1
title: Let an agent run a journey and keep the proof
promise: |
  I can run one of my journeys with the agent CLI I already use.
  I can see what the agent did through MCP, what it proved, and what it told me at the end.
  The agent cannot read my home or its login, and a claim without evidence does not pass.
start: Run this journey with the supported CLI's existing login and the default host read protections. The disposable project has a trusted read-only MCP server and can install a tarball of the same Journeys First build for the separate fixture.
steps:
  - Read the launcher-preflight.txt capture written by the launcher.
  - check: You see the agent start the journey using its existing CLI login, without asking for another login or key.
    id: reuses-cli-login
    launcher: login-reuse
  - check: Commands run by the agent cannot read your host home or the agent CLI's login file.
    id: cannot-read-home-or-login
    launcher: protected-files
  - Have the agent call the read-only MCP tool and submit the recorded response as evidence for a check.
  - check: You see the MCP call and response recorded, and the saved check cites that response.
    id: mcp-call-recorded
  - Inside this run, create a separate disposable one-check journey. Run it with a custom fixture command that submits a pass without evidence. Inspect the child run, not this journey's results file.
  - check: You see that the check without recorded evidence did not pass.
    id: rejects-pass-without-evidence
notes: Cite the launcher evidence for the login and read denials. Do not read or record the login itself. Set the child fixture's TMPDIR outside its project but inside the outer workspace. Capture the child run's verdict and import error to prove the rejection.
