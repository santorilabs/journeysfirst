# yaml-language-server: $schema=https://raw.githubusercontent.com/santorilabs/journeysfirst/main/spec/journey-v1.schema.json
format: journeysfirst/v1
title: Run and interrupt a custom agent command
promise: I can run my own agent command and see its evidence, the limits of its sandbox, and what happened when I stopped it.
start: You have a disposable workspace with a tarball of this Journeys First build you can install. Run each command below against a separate one-check fixture, not this journey.
steps:
  - Run the fixture with --agent and a deterministic local command that writes a capture, submits a result, and prints a handoff.
  - check: You see the saved fixture run marked sandbox unverified.
    id: custom-agent-sandbox-unverified
  - Open or export the saved fixture run in review with transcripts included.
  - check: You can read the fixture's captured transcript and the command's final handoff in review.
    id: review-shows-transcript-and-handoff
  - Run the fixture again with a command that stays running. Send SIGINT only to the child launcher after the fixture command starts.
  - check: You see the command stop and the child launcher save an aborted attempt before returning the interrupt exit status.
    id: custom-agent-interrupt-saved
  - Run the fixture again, from a project with no .mcp.json, with a command that submits no results and prints a handoff saying every check passed.
  - check: You see the launcher say that no MCP servers are configured for the agent.
    id: custom-agent-no-mcp-stated
  - check: You see the launcher name the fixture check that was not checked, and the saved fixture run did not pass.
    id: custom-agent-unchecked-named
notes: Put the fixture's TMPDIR outside its project but inside the outer workspace. Capture the fixture result, review output, interrupt outcome and launcher messages as evidence in this journey.
