name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The caption tests read video frames with ffmpeg.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Tests
        run: npm test
      - name: No private code
        run: npm run check:names
      - name: Types match the code
        run: npm run types -w packages/core && git diff --exit-code packages/core/types
      - name: Files under 600 lines (AGENTS.md)
        run: |
          long=$(git ls-files 'packages/core/src/*.js' 'packages/core/bin/*.js' | xargs wc -l | awk '$2 != "total" && $1 > 600')
          if [ -n "$long" ]; then echo "Split these files (over 600 lines):"; echo "$long"; exit 1; fi
