<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Journey runs</title>
<style>
:root{--ink:#141516;--muted:#6b6d69;--rule:#e6e6e3;--tint:#f3f3f0;--pass:#0c7741;--fail:#a32057;--wait:#6b583c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;line-height:1.45}
main{max-width:1180px;margin:0 auto;padding:32px 16px 64px}h1{font-size:30px;margin:8px 0 6px}a{color:var(--ink)}
.meta,.how,.empty{color:var(--muted);font-size:14px}
.row{display:flex;flex-direction:column;gap:4px;padding:16px 0;border-top:1px solid var(--rule);text-decoration:none}
.row .title{font-weight:600}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 16px}a.row:hover .title{text-decoration:underline}
.runs{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px}.runs a{text-decoration:none}
.verdict{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;color:var(--wait);background:var(--tint)}
.verdict.passed,.verdict.done{color:var(--pass);background:#e8f6ec}.verdict.failed{color:var(--fail);background:#fdebef}
img{width:100%;border:1px solid var(--rule);border-radius:12px;display:block;margin-top:8px}
.player{background:#000;border-radius:12px;overflow:hidden;margin-top:8px}
.player video{display:block;width:100%;border:0;border-radius:0;margin:0;background:#000;cursor:pointer}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}.player:fullscreen video{flex:1;min-height:0;object-fit:contain}
.controls{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141516;color:#fff;font-size:13px}
.controls button{flex:none;width:32px;height:32px;padding:0;border-radius:6px;background:#2a2b2d;font-size:14px}
.controls .seek{flex:1;min-width:40px;accent-color:#f5c542}
.controls .time{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.controls .cc{font-size:11px;font-weight:700}.controls .cc[aria-pressed="true"]{background:#f5c542;color:#000}
.controls select{flex:none;font:inherit;background:#2a2b2d;color:#fff;border:0;border-radius:6px;height:32px;padding:0 4px}
.run-player{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,36%);gap:24px;align-items:start;margin-top:16px}
.rp-main{min-width:0}
.users{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--tint);margin-bottom:8px}
.users button{background:none;color:var(--ink);padding:6px 12px;min-height:36px}
.users button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.track{position:relative;height:36px;margin:8px 14px 0}
.track::before{content:"";position:absolute;left:-14px;right:-14px;top:50%;height:2px;background:var(--rule)}
.tick{position:absolute;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;padding:0;border-radius:50%;font-size:12px;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--rule)}
.tick.dot{width:12px;height:12px}.tick.good{background:var(--pass);border-color:var(--pass);color:#fff}
.tick.bad{background:var(--fail);border-color:var(--fail);color:#fff}.tick.wait{background:var(--wait);border-color:var(--wait);color:#fff}
.tick[aria-current="step"]{outline:2px solid var(--ink);outline-offset:2px}
.step-card{margin-top:8px;padding:16px;border:1px solid var(--rule);border-radius:12px;overflow-wrap:anywhere}
.step-card h2{font-size:20px;margin:4px 0 8px}.step-card p{margin:4px 0}
.steps-panel h2{font-size:17px;margin:0 0 6px}
.rp-steps{list-style:none;margin:0;padding:4px;border:1px solid var(--rule);border-radius:12px}
.line{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start;width:100%;text-align:left;background:none;color:var(--ink);border-radius:8px;border-left:3px solid transparent;padding:8px;font-size:14px;min-height:44px}
.line:hover{background:var(--tint)}.line[aria-current="step"]{background:var(--tint);border-left-color:var(--ink)}
.line[aria-current="step"]:has(.bad){background:#fff1f5;border-left-color:var(--fail)}
.line .n{color:var(--muted);font-size:13px;padding-top:2px}.line[aria-current="step"] .n{color:var(--ink);font-weight:700}
.line-kind{display:block;color:var(--muted);font-size:12px;font-weight:600}
.line .end{display:grid;justify-items:end;gap:2px}
.step-status{border-radius:4px;padding:2px 6px;font-size:12px;font-weight:600;color:var(--wait);background:var(--tint)}
.step-status.good{color:var(--pass);background:#e8f6ec}.step-status.bad{color:var(--fail);background:#fdebef}
@media(max-width:800px){.run-player{grid-template-columns:1fr}}
button{font:inherit;font-size:13px;padding:2px 10px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer}
.error{color:var(--fail);font-size:14px}
.verdict-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.summary{font-weight:600}
.problems{border:1px solid var(--fail);border-radius:12px;padding:4px 16px;margin:12px 0;font-size:14px}.problems ul{padding-left:20px}
details{margin-top:6px;font-size:14px}summary{cursor:pointer;color:var(--muted)}
pre{background:var(--tint);border-radius:8px;padding:8px 10px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.transcript pre{max-height:24rem;overflow:auto}
.evidence{list-style:none;padding:0;margin:6px 0}.evidence li{padding:6px 0;border-top:1px solid var(--rule)}
.evidence dl,.run-details dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0}
.evidence dt,.run-details dt{font-weight:600}.evidence dd,.run-details dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.evidence dd dl{margin:0}.evidence ul.evidence-values{margin:0;padding-left:16px}.evidence-values li{padding:0;border:0}
.run-details{border-top:1px solid var(--rule);margin-top:20px;padding-top:8px}.run-details dl{max-width:620px}
.start{border-top:1px solid var(--rule);padding:8px 0}.start ul{margin:4px 0;padding-left:20px}
.start h2{font-size:17px;margin:4px 0}.found{font-weight:400}
.start .findings{list-style:none;padding:0;margin:4px 0 8px}.findings li{padding:10px 0;border-top:1px solid var(--rule)}.findings li:first-child{border-top:0}
.reported{border-top:1px solid var(--rule);margin-top:12px;padding-top:4px}.reported-user{padding:4px 0}.reported-user p{margin:4px 0}.reported code{font-size:13px;word-break:break-all}
.findings p{margin:2px 0}.findings .says{font-weight:600}.findings a{color:var(--muted)}
@media(max-width:600px){
  .evidence dl,.run-details dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .evidence dt,.run-details dt{overflow-wrap:anywhere}
  .evidence dd+dt,.run-details dd+dt{margin-top:6px}
  .evidence dd dl{border-left:1px solid var(--rule);padding-left:10px}
}
